<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080,height=1920" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      .prep-name { position:absolute; left:250px; color:var(--ink); font-size:48px; font-weight:700; line-height:1.18; }
      .prep-note { position:absolute; left:250px; width:720px; color:var(--muted); font-size:32px; line-height:1.3; }
      .prep-mark { position:absolute; left:132px; width:28px; height:28px; border:5px solid var(--accent); border-radius:50%; background:var(--ground); }
    </style>
  </head>
  <body>
    <main id="root" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:Sarabun,sans-serif;color:var(--ink)" data-composition-id="b3" data-width="1080" data-height="1920" data-duration="13.264">
      <div class="scene-ground" data-layout-ignore></div><header class="series-header" data-layout-ignore><span>LANGMIND · EP03 / CHAT API</span><span class="page-index">03 / 09</span></header><!-- Adapted from the HyperFrames Catalog component: Onboarding Stepper Flow (HF-337). -->
<nav id="ep03-stepper" class="hf-ui-onboarding-flow" aria-label="ลำดับเนื้อหา" data-layout-ignore>
  <div class="hf-ui-onboarding-steps">
    <span class="done"><i>1</i>รู้จักแชต</span>
    <span class="active"><i>2</i>ส่งคำถาม</span>
    <span class=""><i>3</i>ถามต่อ</span>
  </div>
</nav>
<style>
  .hf-ui-onboarding-flow { position:absolute; left:72px; top:116px; width:936px; height:62px; }
  .hf-ui-onboarding-steps { display:flex; justify-content:space-between; gap:14px; width:100%; height:100%; }
  .hf-ui-onboarding-steps span { flex:1; display:flex; justify-content:center; align-items:center; gap:9px; border:2px solid #C9D7D2; border-radius:32px; background:#FFFEFA; color:#536575; font:700 25px Sarabun,sans-serif; transform-origin:center; }
  .hf-ui-onboarding-steps i { width:32px; height:32px; border-radius:50%; background:#D7DFDD; color:#1D2B39; font:700 20px/32px Sarabun,sans-serif; text-align:center; font-style:normal; }
  .hf-ui-onboarding-steps .done { background:#E1EEE9; border-color:#006D5E; color:#006D5E; }
  .hf-ui-onboarding-steps .done i { background:#006D5E; color:#FFFEFA; }
  .hf-ui-onboarding-steps .active { background:#E1F0EE; border-color:#277D7A; color:#176360; }
  .hf-ui-onboarding-steps .active i { background:#277D7A; color:#FFFEFA; }
</style>

      <div id="b3-title" class="clip headline" data-start="0" data-duration="13.264" data-track-index="1">เตรียมของสองอย่าง</div>
      <div id="b3-vertical-path" class="clip" data-start="0" data-duration="13.264" data-track-index="2" style="left:0;top:310px;width:1080px;height:760px">
        <svg width="1080" height="760" viewBox="0 0 1080 760" aria-hidden="true"><path id="b3-spine" d="M146 70 L146 350" fill="none" stroke="#C9D7D2" stroke-width="6" /></svg>
      </div>
      <div id="b3-agent" class="clip" data-start="0.5" data-duration="13.264" data-track-index="3" style="left:0;top:365px;width:900px;height:150px"><div class="prep-mark" style="top:8px"></div><div class="prep-name">agent_id</div><div class="prep-note" style="top:62px">ใช้ ID ของ Agent ที่มีอยู่</div></div>
      <div id="b3-scope" class="clip" data-start="1.5" data-duration="13.264" data-track-index="3" style="left:0;top:645px;width:980px;height:180px"><div class="prep-mark" style="top:8px"></div><div class="prep-name">API key · chat:invoke</div><div class="prep-note" style="top:66px">สิทธิ์เรียก Chat API · เก็บ key ที่ server</div></div>
      <div id="b3-secret" class="clip" data-start="2.4" data-duration="13.264" data-track-index="4" style="left:220px;top:900px;width:700px;height:90px"><div style="padding:18px 22px;border:2px solid var(--teal);border-radius:36px;background:#E1F0EE;color:#176360;text-align:center;font-size:30px;font-weight:700">ห้ามใส่ API key ในหน้าเว็บ</div></div>
    </main>
    <script>
      (() => {
        const root = document.getElementById("root");
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#ep03-stepper .hf-ui-onboarding-steps span", { scale: 0.88, opacity: 0.55 }, { scale: 1, opacity: 1, duration: 0.28, stagger: 0.08, ease: "back.out(1.4)" }, 0.12);
        const spine = document.getElementById("b3-spine");
        spine.style.strokeDasharray = spine.getTotalLength();
        spine.style.strokeDashoffset = spine.getTotalLength();
        tl.to(spine, { strokeDashoffset: 0, duration: 1.8, ease: "none" }, 0.2);
        ["#b3-agent", "#b3-scope", "#b3-secret"].forEach((selector) => {
          const node = document.querySelector(selector);
          const start = Number(node.dataset.start);
          gsap.set(node, { opacity: 0 });
          tl.to(node, { opacity: 1, duration: 0.18, ease: "none" }, start);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines[root.dataset.compositionId] = tl;
      })();
    </script>
  </body>
</html>
