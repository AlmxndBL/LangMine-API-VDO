<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080,height=1920" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      .event-title { position:absolute; left:200px; color:var(--ink); font-size:43px; font-weight:700; line-height:1.15; }
      .event-note { position:absolute; left:200px; color:var(--muted); font-size:32px; line-height:1.25; }
      .event-dot { position:absolute; left:122px; width:32px; height:32px; border:5px solid var(--accent); border-radius:50%; background:var(--ground); }
    </style>
  </head>
  <body>
    <main id="root" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:Sarabun,sans-serif;color:var(--ink)" data-composition-id="b5" data-width="1080" data-height="1920" data-duration="12.060">
      <div class="scene-ground" data-layout-ignore></div><header class="series-header" data-layout-ignore><span>LANGMIND · EP03 / CHAT API</span><span class="page-index">05 / 09</span></header><!-- Adapted from the HyperFrames Catalog component: Onboarding Stepper Flow (HF-337). -->
<nav id="ep03-stepper" class="hf-ui-onboarding-flow" aria-label="ลำดับเนื้อหา" data-layout-ignore>
  <div class="hf-ui-onboarding-steps">
    <span class="done"><i>1</i>รู้จักแชต</span>
    <span class="active"><i>2</i>ส่งคำถาม</span>
    <span class=""><i>3</i>ถามต่อ</span>
  </div>
</nav>
<style>
  .hf-ui-onboarding-flow { position:absolute; left:72px; top:116px; width:936px; height:62px; }
  .hf-ui-onboarding-steps { display:flex; justify-content:space-between; gap:14px; width:100%; height:100%; }
  .hf-ui-onboarding-steps span { flex:1; display:flex; justify-content:center; align-items:center; gap:9px; border:2px solid #C9D7D2; border-radius:32px; background:#FFFEFA; color:#536575; font:700 25px Sarabun,sans-serif; transform-origin:center; }
  .hf-ui-onboarding-steps i { width:32px; height:32px; border-radius:50%; background:#D7DFDD; color:#1D2B39; font:700 20px/32px Sarabun,sans-serif; text-align:center; font-style:normal; }
  .hf-ui-onboarding-steps .done { background:#E1EEE9; border-color:#006D5E; color:#006D5E; }
  .hf-ui-onboarding-steps .done i { background:#006D5E; color:#FFFEFA; }
  .hf-ui-onboarding-steps .active { background:#E1F0EE; border-color:#277D7A; color:#176360; }
  .hf-ui-onboarding-steps .active i { background:#277D7A; color:#FFFEFA; }
</style>

      <div id="b5-title" class="clip headline" data-start="0" data-duration="12.060" data-track-index="1">คำตอบทยอยมาเป็นช่วง</div>
      <div id="b5-label" class="clip tagline" data-start="0" data-duration="12.060" data-track-index="1" style="left:126px;top:272px">ลำดับ event ในตัวอย่าง · ภาพอธิบาย</div>
      <div id="b5-event-path" class="clip" data-start="0" data-duration="12.060" data-track-index="2" style="left:0;top:330px;width:1080px;height:670px">
        <svg width="1080" height="670" viewBox="0 0 1080 670" aria-hidden="true"><path id="b5-spine" d="M138 30 L138 580" fill="none" stroke="#C9D7D2" stroke-width="6" /></svg>
      </div>
      <div id="b5-start" class="clip" data-start="0.5" data-duration="12.060" data-track-index="3" style="left:0;top:352px;width:960px;height:118px"><div class="event-dot" style="top:12px"></div><div class="event-title">message_start</div><div class="event-note" style="top:53px">ให้ conversation_id และ message_id</div></div>
      <div id="b5-message" class="clip" data-start="2.2" data-duration="12.060" data-track-index="4" style="left:0;top:512px;width:960px;height:118px"><div class="event-dot" style="top:12px"></div><div class="event-title">message</div><div class="event-note" style="top:53px">ส่งข้อความเป็นช่วง ๆ</div></div>
      <div id="b5-citations" class="clip" data-start="4.1" data-duration="12.060" data-track-index="5" style="left:0;top:672px;width:960px;height:118px"><div class="event-dot" style="top:12px;border-style:dashed"></div><div class="event-title">citations · อาจมี</div><div class="event-note" style="top:53px">ไม่ใช่ทุกคำตอบจะมี event นี้</div></div>
      <div id="b5-end" class="clip" data-start="6.0" data-duration="12.060" data-track-index="6" style="left:0;top:832px;width:960px;height:118px"><div class="event-dot" style="top:12px;background:var(--accent)"></div><div class="event-title">message_end</div><div class="event-note" style="top:53px">มีคำตอบเต็มและ usage</div></div>
    </main>
    <script>
      (() => {
        const root = document.getElementById("root");
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#ep03-stepper .hf-ui-onboarding-steps span", { scale: 0.88, opacity: 0.55 }, { scale: 1, opacity: 1, duration: 0.28, stagger: 0.08, ease: "back.out(1.4)" }, 0.12);
        const spine = document.getElementById("b5-spine");
        spine.style.strokeDasharray = spine.getTotalLength();
        spine.style.strokeDashoffset = spine.getTotalLength();
        tl.to(spine, { strokeDashoffset: 0, duration: 6.4, ease: "none" }, 0.2);
        ["#b5-start", "#b5-message", "#b5-citations", "#b5-end"].forEach((selector) => {
          const node = document.querySelector(selector);
          const start = Number(node.dataset.start);
          gsap.set(node, { opacity: 0 });
          tl.to(node, { opacity: 1, duration: 0.18, ease: "none" }, start);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines[root.dataset.compositionId] = tl;
      })();
    </script>
  </body>
</html>
