    <script>
      (() => {
        const root = document.getElementById("root");
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#ep03-stepper .hf-ui-onboarding-steps span", { scale: 0.88, opacity: 0.55 }, { scale: 1, opacity: 1, duration: 0.28, stagger: 0.08, ease: "back.out(1.4)" }, 0.12);

        gsap.set("#b6-link", { opacity: 0 });
        tl.to("#b6-link", { opacity: 1, duration: 0.18, ease: "none" }, 1.3);
        window.__timelines = window.__timelines || {};
        window.__timelines[root.dataset.compositionId] = tl;
      })();
