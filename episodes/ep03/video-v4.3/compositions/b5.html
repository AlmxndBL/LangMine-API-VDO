<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080,height=1920" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      .event-title { position:absolute; left:200px; color:var(--ink); font-size:43px; font-weight:700; line-height:1.15; }
      .event-note { position:absolute; left:200px; color:var(--muted); font-size:32px; line-height:1.25; }
      .event-dot { position:absolute; left:122px; width:32px; height:32px; border:5px solid var(--accent); border-radius:50%; background:var(--ground); }
    </style>
  </head>
  <body>
    <main id="root" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:Sarabun,sans-serif;color:var(--ink)" data-composition-id="b5" data-width="1080" data-height="1920" data-duration="13.005">
      <div class="scene-ground" data-layout-ignore></div>
      <div id="b5-title" class="clip headline" data-start="0" data-duration="13.005" data-track-index="1">คำตอบทยอยกลับ</div>
      <div id="b5-label" class="clip tagline" data-start="0" data-duration="13.005" data-track-index="1" style="left:126px;top:272px">ลำดับ event ในตัวอย่าง · ภาพอธิบาย</div>
      <div id="b5-event-path" class="clip" data-start="0" data-duration="13.005" data-track-index="2" style="left:0;top:330px;width:1080px;height:670px">
        <svg width="1080" height="670" viewBox="0 0 1080 670" aria-hidden="true"><path id="b5-spine" d="M138 30 L138 580" fill="none" stroke="#A9C2B9" stroke-width="6" /></svg>
      </div>
      <div id="b5-start" class="clip" data-start="0.5" data-duration="13.005" data-track-index="3" style="left:0;top:352px;width:960px;height:118px"><div class="event-dot" style="top:12px"></div><div class="event-title">message_start</div><div class="event-note" style="top:53px">ให้ conversation_id และ message_id</div></div>
      <div id="b5-message" class="clip" data-start="2.2" data-duration="13.005" data-track-index="4" style="left:0;top:512px;width:960px;height:118px"><div class="event-dot" style="top:12px"></div><div class="event-title">message</div><div class="event-note" style="top:53px">ส่งข้อความเป็นช่วง ๆ</div></div>
      <div id="b5-citations" class="clip" data-start="4.1" data-duration="13.005" data-track-index="5" style="left:0;top:672px;width:960px;height:118px"><div class="event-dot" style="top:12px;border-style:dashed"></div><div class="event-title">citations · อาจมี</div><div class="event-note" style="top:53px">ไม่ใช่ทุกคำตอบจะมี event นี้</div></div>
      <div id="b5-end" class="clip" data-start="6.0" data-duration="13.005" data-track-index="6" style="left:0;top:832px;width:960px;height:118px"><div class="event-dot" style="top:12px;background:var(--accent)"></div><div class="event-title">message_end</div><div class="event-note" style="top:53px">มีคำตอบเต็มและ usage</div></div>
    </main>
    <script>
      (() => {
        const root = document.getElementById("root");
        const tl = gsap.timeline({ paused: true });
        const spine = document.getElementById("b5-spine");
        spine.style.strokeDasharray = spine.getTotalLength();
        spine.style.strokeDashoffset = spine.getTotalLength();
        tl.to(spine, { strokeDashoffset: 0, duration: 6.4, ease: "none" }, 0.2);
        ["#b5-start", "#b5-message", "#b5-citations", "#b5-end"].forEach((selector) => {
          const node = document.querySelector(selector);
          const start = Number(node.dataset.start);
          gsap.set(node, { opacity: 0 });
          tl.to(node, { opacity: 1, duration: 0.18, ease: "none" }, start);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines[root.dataset.compositionId] = tl;
      })();
    </script>
  </body>
</html>
