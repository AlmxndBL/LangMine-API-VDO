<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080,height=1920" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      .brand-line { position:absolute; left:72px; top:1000px; width:936px; text-align:center; color:var(--ink); font-size:54px; font-weight:700; }
      .brand-url { position:absolute; left:72px; top:1075px; width:936px; text-align:center; color:var(--accent); font-size:40px; }
      .brand-logo { position:absolute; left:185px; top:360px; width:710px; height:auto; object-fit:contain; }
    </style>
  </head>
  <body>
    <main id="root" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:Sarabun,sans-serif;color:var(--ink)" data-composition-id="b9" data-width="1080" data-height="1920" data-duration="9.377">
      <div class="scene-ground" data-layout-ignore></div>
      <div id="b9-brand" class="clip" data-start="0" data-duration="9.377" data-track-index="1" style="left:0;top:0;width:1080px;height:1330px">
        <img id="b9-logo" class="brand-logo" src="../assets/brand/langmind-logo.png" alt="LangMind" />
        <div class="brand-line">LangMind API</div>
        <div class="brand-url">langmind.in.th</div>
      </div>
    </main>
    <script>
      (() => {
        const root = document.getElementById("root");
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#b9-logo", { x: -36, opacity: 0.84 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
        window.__timelines = window.__timelines || {};
        window.__timelines[root.dataset.compositionId] = tl;
      })();
    </script>
  </body>
</html>
