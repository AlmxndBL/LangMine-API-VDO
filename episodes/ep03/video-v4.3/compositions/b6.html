<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080,height=1920" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      .id-flow { position:absolute; left:180px; top:1082px; color:var(--accent); font-size:32px; font-weight:700; }
    </style>
  </head>
  <body>
    <main id="root" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:Sarabun,sans-serif;color:var(--ink)" data-composition-id="b6" data-width="1080" data-height="1920" data-duration="8.177">
      <div class="scene-ground" data-layout-ignore></div>
      <div id="b6-title" class="clip headline" data-start="0" data-duration="8.177" data-track-index="1">ถามต่อในบทสนทนาเดิม</div>
      <div id="b6-screen" class="clip screen-frame" data-start="0" data-duration="8.177" data-track-index="2" style="left:120px;top:260px;width:840px;height:817px">
        <img id="b6-screen-media" class="screen-media" src="../assets/screens/CHAT-02.png" alt="ภาพจำลองบทสนทนาต่อเนื่อง" />
      </div>
      <div id="b6-flow" class="clip id-flow" data-start="0.6" data-duration="8.177" data-track-index="3">conversation_id เดิม → request ถัดไป</div>
    </main>
    <script>
      (() => {
        const root = document.getElementById("root");
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#b6-screen-media", { scale: 1.015 }, { scale: 1, duration: 0.35, ease: "power1.out" }, 0);
        const flow = document.getElementById("b6-flow");
        gsap.set(flow, { opacity: 0 });
        tl.to(flow, { opacity: 1, duration: 0.18, ease: "none" }, Number(flow.dataset.start));
        window.__timelines = window.__timelines || {};
        window.__timelines[root.dataset.compositionId] = tl;
      })();
    </script>
  </body>
</html>
