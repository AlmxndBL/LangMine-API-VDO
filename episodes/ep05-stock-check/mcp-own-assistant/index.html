</style><header><strong>EP05 / LANGMIND MCP</strong><span class="badge">ภาพจำลอง</span></header><div class="progress"></div><main></main><div class="brand"><img src="../assets/langmind-logo.png" alt="">LangMind</div>
<script src="sync-cues.js"></script><script>
const beats=[["เริ่มจากคำถาม","วันแรกต้องส่งเอกสารอะไร?",["พนักงานถามในหน้าแชท","ผู้ช่วยพนักงานใหม่ของบริษัท"],"พนักงานใหม่เปิดหน้าแชทแล้วถามว่า วันแรกต้องส่งเอกสารอะไรบ้าง นี่คือผู้ช่วยพนักงานใหม่ที่บริษัทสร้างเอง ให้คนในทีมถามเรื่องคู่มือได้"],["ภาพรวมระบบ","คำถามเดินทางไปไหน?",["หน้าแชทของเรา","ระบบหลังบ้านของเรา","MCP → LangMind"],"หน้าแชทรับคำถามของพนักงาน ระบบหลังบ้านรับข้อความแล้วเรียกเครื่องมือที่เชื่อมไว้ เอ็มซีพีเป็นทางเชื่อมจากระบบหลังบ้านไปยังแลงมายด์"],["ใครหาคำตอบ","เอเจนต์ตอบจากคู่มือ",["คำถามจากผู้ช่วยของเรา","เอเจนต์คู่มือใน LangMind","คำตอบและแหล่งอ้างอิง"],"ผู้ช่วยส่งคำถามเรื่องเอกสารวันแรก เอเจนต์ในแลงมายด์ใช้คู่มือพนักงานเพื่อหาคำตอบ แล้วส่งคำตอบและแหล่งอ้างอิงกลับมา"],["01 เตรียม","เตรียมเอเจนต์และคู่มือ",["ผูกคู่มือกับเอเจนต์","ให้ผู้ดูแลเปิด MCP"],"ผูกคู่มือพนักงานกับเอเจนต์ที่ต้องการใช้ ให้ผู้ดูแลเปิดเอ็มซีพีและตรวจสิทธิ์เข้าถึงเอเจนต์"],["01 เตรียม","ให้สิทธิ์ตามที่ใช้",["agents:read · เลือกเอเจนต์","chat:invoke · ถามเอเจนต์"],"ถ้าต้องค้นชื่อเอเจนต์ ให้ใช้สิทธิ์เอเจนต์รีด ส่วนการถามเอเจนต์ใช้สิทธิ์แชตอินโวก"],["02 เชื่อม","ตั้งค่าที่ระบบหลังบ้าน",["https://langmind.in.th/mcp","Authorization: Bearer <TOKEN>","เก็บคีย์ฝั่งเซิร์ฟเวอร์"],"ตั้งปลายทางเอ็มซีพีของแลงมายด์ในระบบหลังบ้าน ในตัวอย่างนี้ระบบหลังบ้านส่งคีย์ในเฮดเดอร์สำหรับยืนยันตัวตน เก็บคีย์ไว้บนเซิร์ฟเวอร์ แยกจากหน้าแชท"],["02 เชื่อม","ส่งข้อมูลให้ ask_agent",["เลือกเอเจนต์คู่มือ","ส่งคำถามของพนักงาน"],"ให้ระบบหลังบ้านระบุเอเจนต์คู่มือพนักงาน แล้วเรียกแอสก์เอเจนต์พร้อมคำถามเรื่องเอกสารวันแรก"],["03 ใช้ผล","อ่านผลที่เครื่องมือคืน",["คำตอบ · เอกสารที่ต้องเตรียม","ที่มา · คู่มือพนักงานใหม่","conversation_id · ใช้ถามต่อ"],"เครื่องมือคืนคำตอบเกี่ยวกับเอกสารที่ต้องเตรียม พร้อมชื่อคู่มือที่ใช้เป็นแหล่งอ้างอิง และคอนเวอร์เซชันไอดีสำหรับถามต่อ"],["03 ใช้ผล","แสดงคำตอบในแชทของเรา",["สำเนาบัตรประชาชน","ข้อมูลบัญชีธนาคาร","ที่มา · คู่มือพนักงานใหม่ (สมมติ)"],"ในตัวอย่างสมมติ หน้าแชทตอบว่าให้เตรียมสำเนาบัตรประชาชน พร้อมข้อมูลบัญชีธนาคาร พนักงานเปิดที่มาเพื่อเทียบคำตอบกับคู่มือได้"],["03 ถามต่อ","ถามต่อโดยใช้บริบทเดิม",["“แล้วส่งเอกสารให้ใคร?”","ส่ง conversation_id เดิม","คำถามต่อเนื่อง"],"พนักงานถามต่อว่า แล้วส่งเอกสารให้ใคร ระบบหลังบ้านส่งคอนเวอร์เซชันไอดีเดิมไปกับคำถามใหม่ เอเจนต์จึงใช้บริบทจากคำถามก่อนหน้าได้"],["สรุป","เริ่มด้วยคำถามเดียว",["เตรียมคู่มือและสิทธิ์","เชื่อมจากระบบหลังบ้าน","ลองถามและตรวจที่มา"],"เริ่มจากเตรียมคู่มือและสิทธิ์ เชื่อมเอ็มซีพีจากระบบหลังบ้านของผู้ช่วยเรา แล้วลองถามหนึ่งข้อและตรวจคำตอบกับคู่มือจริง"]];
const i=Number(new URLSearchParams(location.search).get("step"))||0;
const [phase,title,items,voice,kind]=beats[i];
const esc=s=>s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
const flow=[1,2,7,9].includes(i);
const nodes=items.map((s,j)=>(flow&&j?'<div class="arrow">↓</div>':'')+'<div class="node">'+esc(s)+'</div>').join("");
document.querySelector(".progress").innerHTML=beats.map((_,j)=>'<i class="'+(j<=i?"active":"")+'"></i>').join("");
document.querySelector("main").innerHTML='<h1><small>'+phase+'</small>'+title+'</h1><div class="nodes '+(kind==="code"?"code":"")+'">'+nodes+'</div>'+([0,5,8].includes(i)?'<img class="robot" src="../../../shared/assets/characters/robot/'+(i===8?'12-clipboard':'05-point-up')+'.png" alt="">':'')+'<div class="caption">'+esc(voice.replaceAll("เอชทีทีพีเอส แลงมายด์ ดอต อิน ดอต ทีเอช ทับ เอ็มซีพี","https://langmind.in.th/mcp").replaceAll("แลงมายด์","LangMind").replaceAll("เอ็มซีพี","MCP").replaceAll("แอสก์เอเจนต์","ask_agent").replaceAll("คอนเวอร์เซชันไอดี","conversation_id").replaceAll("โอออธ","OAuth"))+'</div>';
const parts=[...document.querySelectorAll("h1,.node,.arrow,.robot,.caption")];
const cues=window.cueTrack[i];
const readable=line=>line.replaceAll("เอชทีทีพีเอส แลงมายด์ ดอต อิน ดอต ทีเอช ทับ เอ็มซีพี","https://langmind.in.th/mcp").replaceAll("แลงมายด์","LangMind").replaceAll("เอ็มซีพี","MCP").replaceAll("แอสก์เอเจนต์","ask_agent").replaceAll("ลิสต์เอเจนต์","list_agents").replaceAll("คอนเวอร์เซชันไอดี","conversation_id").replaceAll("โอออธ","OAuth").replaceAll("เอพีไอคีย์","API Key").replaceAll("เอเจนต์รีด","agents:read").replaceAll("แชตอินโวก","chat:invoke").replaceAll("นอลเลจรีด","knowledge:read").replaceAll("แอลเอ็มโทเคน","LM_TOKEN").replaceAll("เอชทีทีพี","HTTP").replaceAll("ยูอาร์แอล","URL");
const clamp=n=>Math.max(0,Math.min(1,n));
window.seekBeat=(time,duration)=>{
 for(const [j,el] of parts.entries()){
  const caption=el.classList.contains("caption");
  const arrow=el.classList.contains("arrow");
  const ordinal=parts.slice(0,j).filter(p=>p.classList.contains("node")).length;
  let start=j===0?0:el.classList.contains("robot")?.2:cues[Math.max(0,ordinal-(arrow?0:0))]?.[0]??0;
  let stop=duration-.2;
  if(caption){
   const cue=cues.find(([a,b])=>time>=a-.16&&time<=b+.16);
   if(!cue){el.style.opacity=0;el.textContent="";continue;}
   const [a,b,line]=cue; start=a-.16;stop=b+.16;el.textContent=readable(line);
  }
  const ease=1-Math.pow(1-clamp((time-start)/.25),3);
  const out=clamp((stop-time)/.2);
  el.style.opacity=ease*out;
  if(arrow)el.style.clipPath="inset(0 0 "+((1-ease)*100)+"% 0)";
  el.style.transform="translateY("+((1-ease)*18+(1-out)*-10)+"px)";
 }
};
</script></html>
