</style><header><strong>EP05 / LANGMIND MCP</strong><span class="badge">ภาพจำลอง</span></header><div class="progress"></div><main></main><div class="brand"><img src="../assets/langmind-logo.png" alt="">LangMind</div>
<script src="sync-cues.js"></script><script>
const beats=[["เริ่มจากคำถามจริง", "พนักงานใหม่ต้องส่งอะไรวันแรก?", ["พนักงานใหม่ถามในแชท", "ให้ผู้ช่วยค้นคำตอบจากคู่มือ"], "สมมติพนักงานใหม่ถามว่า วันแรกต้องส่งเอกสารอะไร ถ้าคู่มืออยู่ในแลงมายด์ เราให้ผู้ช่วยในแชตจีพีทีไปถามเอเจนต์คู่มือให้ได้"], ["MCP ทำหน้าที่อะไร", "ตัวเชื่อมผู้ช่วยกับเครื่องมือ", ["ChatGPT", "MCP", "LangMind"], "แชตจีพีทีคือแอปที่เราใช้พิมพ์คำถาม เอ็มซีพีเป็นทางเชื่อมให้แอปเรียกเครื่องมือ เครื่องมือนี้อยู่ในแลงมายด์"], ["ใครหาคำตอบ", "เอเจนต์ใช้คู่มือของทีม", ["คำถาม", "เอเจนต์คู่มือ", "คำตอบ + ที่มา"], "ผู้ช่วยส่งคำถามของพนักงานใหม่ เอเจนต์คู่มือพนักงานเป็นฝั่งที่หาคำตอบ ผู้ช่วยนำคำตอบและแหล่งอ้างอิงกลับมาแสดง"], ["01 เตรียม", "เปิด MCP และผูกคู่มือ", ["ผู้ดูแลเปิด MCP", "เอเจนต์คู่มือพนักงาน"], "ก่อนเชื่อม ให้ผู้ดูแลเปิดเอ็มซีพี แล้วเตรียมเอเจนต์ที่ผูกกับคู่มือของทีม"], ["01 เตรียม", "ตรวจสิทธิ์ก่อนเชื่อม", ["ผู้ดูแลเปิด MCP", "บัญชีเข้าถึงเอเจนต์ได้", "Workspace อนุญาตให้เพิ่มตัวเชื่อม"], "ให้ผู้ดูแลเปิดเอ็มซีพีในแลงมายด์ก่อน ตรวจว่าบัญชีของคุณเข้าถึงเอเจนต์คู่มือได้ ในแชตจีพีที เวิร์กสเปซต้องอนุญาตให้เพิ่มตัวเชื่อมเอ็มซีพี"], ["02 เชื่อม", "เพิ่ม LangMind ใน ChatGPT", ["เพิ่ม Custom MCP Server", "https://langmind.in.th/mcp", "เลือก OAuth"], "ในแชตจีพีทีบนเว็บ ให้เปิดหน้า Plugins แล้วเลือกเพิ่มเซิร์ฟเวอร์เอ็มซีพี ใส่ยูอาร์แอล เอชทีทีพีเอส แลงมายด์ ดอต อิน ดอต ทีเอช ทับ เอ็มซีพี เลือกการเข้าสู่ระบบแบบโอออธ"], ["02 เชื่อม", "เข้าสู่ระบบและอนุญาต", ["เข้าสู่ระบบ LangMind", "ตรวจสิทธิ์แล้วกดอนุญาต"], "เมื่อระบบขอเชื่อมบัญชี ให้เข้าสู่ระบบแลงมายด์ อ่านสิทธิ์ที่ขอ แล้วกดอนุญาตเพื่อให้แชตจีพีทีใช้ตัวเชื่อมได้"], ["03 ลองถาม", "ถามจากหน้าแชท", ["เลือกตัวเชื่อม LangMind", "ถามเอเจนต์คู่มือพนักงาน", "เบื้องหลัง · ask_agent"], "กลับมาที่หน้าแชทแล้วเลือกตัวเชื่อมแลงมายด์ พิมพ์ว่า ใช้เอเจนต์คู่มือพนักงาน ช่วยดูว่าต้องส่งเอกสารอะไรวันแรก เบื้องหลัง ผู้ช่วยเรียกเครื่องมือแอสก์เอเจนต์ไปถามให้"], ["03 ดูผล", "อ่านคำตอบพร้อมที่มา", ["สำเนาบัตรประชาชน", "ข้อมูลบัญชีธนาคาร", "ที่มา · คู่มือพนักงานใหม่ (สมมติ)"], "ในตัวอย่างสมมติ คู่มือระบุให้เตรียมสำเนาบัตรประชาชน และข้อมูลบัญชีธนาคาร เปิดแหล่งอ้างอิงเพื่อเทียบคำตอบกับคู่มือได้"], ["03 ถามต่อ", "คุยเรื่องเดิมในแชท", ["“แล้วส่งเอกสารให้ใคร?”", "เบื้องหลัง · conversation_id", "ใช้บริบทจากคำถามก่อนหน้า"], "ลองถามต่อในแชทเดิมว่า แล้วส่งเอกสารให้ใคร ในระดับเครื่องมือ ใช้คอนเวอร์เซชันไอดีเดิมเพื่อถามต่อ เอเจนต์จึงใช้บริบทจากคำถามก่อนหน้าได้"], ["สรุป", "เริ่มด้วยคำถามเดียว", ["เตรียมเอเจนต์และสิทธิ์", "เชื่อมผู้ช่วยผ่าน MCP", "ลองถามแล้วตรวจที่มา"], "เริ่มจากเตรียมเอเจนต์และสิทธิ์ เชื่อมผู้ช่วยผ่านเอ็มซีพี แล้วลองถามหนึ่งข้อและตรวจที่มาจากคู่มือของทีม"]];
const i=Number(new URLSearchParams(location.search).get("step"))||0;
const [phase,title,items,voice,kind]=beats[i];
const esc=s=>s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
const flow=[1,2,7,9].includes(i);
const nodes=items.map((s,j)=>(flow&&j?'<div class="arrow">↓</div>':'')+'<div class="node">'+esc(s)+'</div>').join("");
document.querySelector(".progress").innerHTML=beats.map((_,j)=>'<i class="'+(j<=i?"active":"")+'"></i>').join("");
document.querySelector("main").innerHTML='<h1><small>'+phase+'</small>'+title+'</h1><div class="nodes '+(kind==="code"?"code":"")+'">'+nodes+'</div>'+([0,5,8].includes(i)?'<img class="robot" src="../../../shared/assets/characters/robot/'+(i===8?'12-clipboard':'05-point-up')+'.png" alt="">':'')+'<div class="caption">'+esc(voice.replaceAll("แชตจีพีที","ChatGPT").replaceAll("เวิร์กสเปซ","workspace").replaceAll("เอชทีทีพีเอส แลงมายด์ ดอต อิน ดอต ทีเอช ทับ เอ็มซีพี","https://langmind.in.th/mcp").replaceAll("แลงมายด์","LangMind").replaceAll("เอ็มซีพี","MCP").replaceAll("แอสก์เอเจนต์","ask_agent").replaceAll("คอนเวอร์เซชันไอดี","conversation_id").replaceAll("โอออธ","OAuth"))+'</div>';
const parts=[...document.querySelectorAll("h1,.node,.arrow,.robot,.caption")];
const cues=window.cueTrack[i];
const readable=line=>line.replaceAll("แชตจีพีที","ChatGPT").replaceAll("เวิร์กสเปซ","workspace").replaceAll("เอชทีทีพีเอส แลงมายด์ ดอต อิน ดอต ทีเอช ทับ เอ็มซีพี","https://langmind.in.th/mcp").replaceAll("แลงมายด์","LangMind").replaceAll("เอ็มซีพี","MCP").replaceAll("แอสก์เอเจนต์","ask_agent").replaceAll("ลิสต์เอเจนต์","list_agents").replaceAll("คอนเวอร์เซชันไอดี","conversation_id").replaceAll("โอออธ","OAuth").replaceAll("เอพีไอคีย์","API Key").replaceAll("เอเจนต์รีด","agents:read").replaceAll("แชตอินโวก","chat:invoke").replaceAll("นอลเลจรีด","knowledge:read").replaceAll("แอลเอ็มโทเคน","LM_TOKEN").replaceAll("เอชทีทีพี","HTTP").replaceAll("ยูอาร์แอล","URL");
const clamp=n=>Math.max(0,Math.min(1,n));
window.seekBeat=(time,duration)=>{
 for(const [j,el] of parts.entries()){
  const caption=el.classList.contains("caption");
  const arrow=el.classList.contains("arrow");
  const ordinal=parts.slice(0,j).filter(p=>p.classList.contains("node")).length;
  let start=j===0?0:el.classList.contains("robot")?.2:cues[Math.max(0,ordinal-(arrow?0:0))]?.[0]??0;
  let stop=duration-.2;
  if(caption){
   const cue=cues.find(([a,b])=>time>=a-.16&&time<=b+.16);
   if(!cue){el.style.opacity=0;el.textContent="";continue;}
   const [a,b,line]=cue; start=a-.16;stop=b+.16;el.textContent=readable(line);
  }
  const ease=1-Math.pow(1-clamp((time-start)/.25),3);
  const out=clamp((stop-time)/.2);
  el.style.opacity=ease*out;
  if(arrow)el.style.clipPath="inset(0 0 "+((1-ease)*100)+"% 0)";
  el.style.transform="translateY("+((1-ease)*18+(1-out)*-10)+"px)";
 }
};
</script></html>
