<!doctype html><html lang="th"><meta charset="utf-8"><title>EP05 · LangMind MCP</title><style>
@font-face{font-family:Thai;src:url(../assets/NotoSansThai.ttf);font-weight:100 900}*{box-sizing:border-box}body{margin:0;width:1080px;height:1920px;background:repeating-linear-gradient(#f7f3e6 0 58px,#e6e1d0 59px 61px);color:#20382e;font:650 42px Thai;padding:100px 84px}header{display:flex;justify-content:space-between;font-size:34px;font-weight:760}.badge{border:2px solid;border-radius:40px;padding:5px 20px}.progress{display:flex;gap:10px;margin-top:28px}.progress i{flex:1;height:6px;border-radius:9px;background:#b9c7b1}.progress .active{background:#48765b}h1{font-size:78px;line-height:1.2;margin:65px 0 36px}h1 small{display:block;font-size:37px;color:#48765b;margin-bottom:15px}.nodes{display:grid;gap:20px}.node{padding:24px 34px;background:#fffcf1;border:3px solid #48765b;border-radius:25px;box-shadow:9px 9px #bfd0b7;font-size:44px}.arrow{font-size:48px;text-align:center;line-height:1;color:#48765b}.code{background:#20382e;color:#e6ffa7;padding:30px;border-radius:24px}.code .node{padding:8px;border:0;background:none;box-shadow:none;font:35px Consolas,monospace;white-space:pre-wrap}.robot{position:absolute;bottom:330px;right:88px;width:250px;height:265px;object-fit:contain}.caption{position:absolute;bottom:121px;left:84px;right:84px;background:#20382e;color:#fff;border-radius:24px;padding:22px 28px;text-align:center;font-size:38px;line-height:1.35;font-weight:700}.brand{position:absolute;bottom:54px;left:84px;font-size:30px}.brand img{width:49px;vertical-align:middle;margin-right:12px}
</style><header><strong>EP05 / LANGMIND MCP</strong><span class="badge">ภาพจำลอง</span></header><div class="progress"></div><main></main><div class="brand"><img src="../assets/langmind-logo.png" alt="">LangMind</div>
<script src="sync-cues.js"></script><script>
const beats=[["เริ่มจากคำถามจริง","พนักงานใหม่ต้องส่งอะไรวันแรก?",["Claude Code","ถามคู่มือพนักงาน"],"ถ้าพนักงานใหม่ถามว่า วันแรกต้องส่งเอกสารอะไร เราให้ผู้ช่วยในคลอดโค้ดไปถามคู่มือของทีมได้"],["MCP ทำหน้าที่อะไร","ตัวเชื่อมผู้ช่วยกับเครื่องมือ",["Claude Code","MCP","LangMind"],"เอ็มซีพีเป็นทางเชื่อม จากคลอดโค้ดไปยังเครื่องมือในแลงมายด์"],["ใครหาคำตอบ","เอเจนต์ใช้คู่มือของทีม",["คำถาม","เอเจนต์คู่มือ","คำตอบ + ที่มา"],"เอเจนต์คู่มือพนักงานเป็นฝั่งที่ตอบ ผู้ช่วยในคลอดโค้ดนำคำตอบและแหล่งอ้างอิงมาแสดง"],["01 เตรียม","เปิด MCP และผูกคู่มือ",["ผู้ดูแลเปิด MCP","เอเจนต์คู่มือพนักงาน"],"ก่อนเชื่อม ให้ผู้ดูแลเปิดเอ็มซีพี และเตรียมเอเจนต์ที่ผูกกับคู่มือของทีม"],["01 เตรียม","เลือกสิทธิ์ตามงาน",["agents:read · หาเอเจนต์","chat:invoke · ถามเอเจนต์","knowledge:read · ค้นคลัง"],"คีย์ต้องมีสิทธิ์ตามงาน อ่านเอเจนต์เพื่อค้นชื่อ ถามเอเจนต์เพื่อรับคำตอบ และอ่านคลังความรู้เมื่อต้องการค้นเอกสาร"],["02 เชื่อม","เพิ่ม LangMind ใน Claude Code",["claude mcp add --transport http langmind \\","  https://langmind.in.th/mcp \\","  --header \"Authorization: Bearer $LM_TOKEN\""],"ในแบช ใช้คำสั่งคลอดเอ็มซีพีแอด เพื่อเพิ่มแลงมายด์ผ่านเอชทีทีพี โดยคีย์มาจากตัวแปร แอลเอ็มโทเคน","code"],["02 เชื่อม","ใช้วิธีเข้าสู่ระบบตามแอป",["Claude Code · API Key","Claude.ai / ChatGPT · OAuth"],"ถ้าใช้คลอดโค้ดให้ส่งคีย์ ส่วนคลอดบนเว็บหรือแชตจีพีที ให้เพิ่มตัวเชื่อมแล้วเข้าสู่ระบบและกดอนุญาต"],["03 ลองถาม","หาเอเจนต์ก่อนส่งคำถาม",["list_agents","เลือกเอเจนต์คู่มือ","ask_agent"],"ให้ผู้ช่วยใช้ลิสต์เอเจนต์เพื่อเลือกเอเจนต์คู่มือพนักงาน แล้วใช้แอสก์เอเจนต์ส่งคำถามเรื่องเอกสารวันแรก"],["03 ดูผล","อ่านคำตอบพร้อมที่มา",["สำเนาบัตรประชาชน","ข้อมูลบัญชีธนาคาร","ที่มา · คู่มือพนักงานใหม่ (สมมติ)"],"ในตัวอย่างสมมติ คู่มือระบุว่าต้องเตรียมสำเนาบัตรประชาชนและข้อมูลบัญชีธนาคาร เปิดที่มาเพื่อเทียบคำตอบกับคู่มือได้"],["03 ถามต่อ","ส่ง ID เดิมเพื่อคุยต่อ",["“แล้วส่งเอกสารให้ใคร?”","conversation_id เดิม","บริบทจากคำถามก่อนหน้า"],"ถ้าถามต่อว่าส่งเอกสารให้ใคร ให้ส่งคอนเวอร์เซชันไอดีเดิมกลับไป เพื่อให้เอเจนต์คุยต่อจากคำถามก่อนหน้า"],["สรุป","เริ่มด้วยคำถามเดียว",["เตรียมเอเจนต์และสิทธิ์","เชื่อมผู้ช่วยผ่าน MCP","ลองถามแล้วตรวจที่มา"],"เริ่มจากเตรียมเอเจนต์และสิทธิ์ เชื่อมผู้ช่วยผ่านเอ็มซีพี แล้วลองถามหนึ่งข้อและตรวจที่มาจากคู่มือของทีม"]];
const i=Number(new URLSearchParams(location.search).get("step"))||0;
const [phase,title,items,voice,kind]=beats[i];
const esc=s=>s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
const flow=[1,2,7,9].includes(i);
const nodes=items.map((s,j)=>(flow&&j?'<div class="arrow">↓</div>':'')+'<div class="node">'+esc(s)+'</div>').join("");
document.querySelector(".progress").innerHTML=beats.map((_,j)=>'<i class="'+(j<=i?"active":"")+'"></i>').join("");
document.querySelector("main").innerHTML='<h1><small>'+phase+'</small>'+title+'</h1><div class="nodes '+(kind==="code"?"code":"")+'">'+nodes+'</div>'+([0,5,8].includes(i)?'<img class="robot" src="../../../shared/assets/characters/robot/'+(i===8?'12-clipboard':'05-point-up')+'.png" alt="">':'')+'<div class="caption">'+esc(voice.replaceAll("คลอดโค้ด","Claude Code").replaceAll("แลงมายด์","LangMind").replaceAll("เอ็มซีพี","MCP").replaceAll("แอสก์เอเจนต์","ask_agent").replaceAll("คอนเวอร์เซชันไอดี","conversation_id").replaceAll("โอออธ","OAuth"))+'</div>';
const parts=[...document.querySelectorAll("h1,.node,.arrow,.robot,.caption")];
const cues=window.cueTrack[i];
const readable=line=>line.replaceAll("คลอดโค้ด","Claude Code").replaceAll("แลงมายด์","LangMind").replaceAll("เอ็มซีพี","MCP").replaceAll("แอสก์เอเจนต์","ask_agent").replaceAll("ลิสต์เอเจนต์","list_agents").replaceAll("คอนเวอร์เซชันไอดี","conversation_id").replaceAll("โอออธ","OAuth").replaceAll("เอพีไอคีย์","API Key").replaceAll("เอเจนต์รีด","agents:read").replaceAll("แชตอินโวก","chat:invoke").replaceAll("นอลเลจรีด","knowledge:read").replaceAll("แอลเอ็มโทเคน","LM_TOKEN").replaceAll("เอชทีทีพี","HTTP").replaceAll("ยูอาร์แอล","URL");
const clamp=n=>Math.max(0,Math.min(1,n));
window.seekBeat=(time,duration)=>{
 for(const [j,el] of parts.entries()){
  const caption=el.classList.contains("caption");
  const arrow=el.classList.contains("arrow");
  const ordinal=parts.slice(0,j).filter(p=>p.classList.contains("node")).length;
  let start=j===0?0:el.classList.contains("robot")?.2:cues[Math.max(0,ordinal-(arrow?0:0))]?.[0]??0;
  let stop=duration-.2;
  if(caption){
   const cue=cues.find(([a,b])=>time>=a-.16&&time<=b+.16);
   if(!cue){el.style.opacity=0;el.textContent="";continue;}
   const [a,b,line]=cue; start=a-.16;stop=b+.16;el.textContent=readable(line);
  }
  const ease=1-Math.pow(1-clamp((time-start)/.25),3);
  const out=clamp((stop-time)/.2);
  el.style.opacity=ease*out;
  if(arrow)el.style.clipPath="inset(0 0 "+((1-ease)*100)+"% 0)";
  el.style.transform="translateY("+((1-ease)*18+(1-out)*-10)+"px)";
 }
};
</script></html>
