s:30px;font-family:Sarabun;--ink:#fff;--bubble:#343434}.header{position:absolute;top:0;left:0;width:100%;height:102px;display:grid;place-items:center;font:700 45px Sarabun;background:#242424;color:#fff;z-index:15}.scrollport{top:110px;bottom:100px}.thread{padding:25px 32px}.bubble{width:750px;font:46px/1.5 Sarabun;padding:20px 27px;border-radius:24px}.answer{font:45px/1.55 Sarabun;color:white;margin-top:35px}.para{font:inherit;height:auto}.w{opacity:1}.composer{position:absolute;left:25px;top:auto;bottom:20px;width:836px;height:80px;border:3px solid #aaa;border-radius:18px;font:37px Sarabun;padding:14px 22px;color:#d8d8d8;background:#242424}.note{top:1320px;font-size:38px}#acr-ph{position:absolute;left:22px;top:20px;transform:none;width:700px;max-width:700px;white-space:normal}#acr-pill{height:94px;min-height:94px;display:block}#acr-cmic{display:none}#acr-btn-send-black{right:8px;top:8px}.acr-stage{height:880px}#acr-answer{font-size:45px}#acr-composer{bottom:18px}</style><div id="root" data-composition-id="b01-1" style="--paper:#fff9e9;--label:#8bc1ff"><div class="kicker">EP02 · เว็บแชทของเราเอง</div><h1>ใช้ AI ช่วยร่างข้อความอยู่แล้ว?</h1><div class="screen" id="cge-screen"><div class="header">ChatGPT</div><div class="composer">ถาม ChatGPT</div></div><div class="note">ภาพจำลอง · คำตอบตัวอย่าง</div></div><script>const CONFIG={prompt:"ช่วยเขียนข้อความแจ้งลูกค้าว่าสินค้าส่งช้า ให้สุภาพหน่อย",paragraphs:["ขออภัยค่ะ ขณะนี้การจัดส่งสินค้าล่าช้ากว่ากำหนด ทางร้านกำลังติดตามและจะแจ้งความคืบหน้าให้ทราบ ขอบคุณที่อดทนรอนะคะ"]};const screen = document.getElementById("cge-screen");
      const el = (cls, html, tag) => {
        const n = document.createElement(tag || "div");
        if (cls) n.className = cls;
        // Editable strings reach innerHTML; the template delivery gate rejects angle brackets.
        if (html != null) n.innerHTML = html;
        return n;
      };

      // --- status bar
      const sb = el("statusbar");
      sb.innerHTML =
        `<div class="sb-left"><div class="sb-clock sb-clock-box">` +
        `<span id="cge-clock-early">${CONFIG.status.clock}</span>` +
        `<span id="cge-clock-late">${CONFIG.status.clockLate}</span></div>${ICO.bell}</div>` +
        `<div class="sb-right">${ICO.bars}<div class="sb-net">${CONFIG.status.net}</div>` +
        `<div class="sb-batt"><span id="cge-batt-early">${CONFIG.status.battery}</span>` +
        `<span id="cge-batt-late">${CONFIG.status.batteryLate}</span></div>` +
        `<div class="sb-batt-cap"></div></div>`;

      // --- thread
      const port = el("scrollport");
      const thread = el("thread");
      thread.setAttribute("data-layout-allow-overflow", "true");
      thread.setAttribute("data-layout-allow-overlap", "true");
      thread.setAttribute("data-layout-allow-occlusion", "true");
      thread.id = "cge-thread";

      const bubble = el("bubble");
      bubble.id = "cge-bubble";
      bubble.textContent = CONFIG.prompt + "?";
      thread.appendChild(bubble);

      const answer = el("answer");
      answer.id = "cge-answer";
      thread.appendChild(answer);

      // paragraphs -> word spans (**bold** supported)
      const paraEls = [];
      CONFIG.paragraphs.forEach((txt) => {
        const p = el("para");
        const inner = el("para-inner");
        let bold = false;
        txt.split(/(\s+)/).forEach((tok) => {
          if (!tok) return;
          if (/^\s+$/.test(tok)) {
            inner.appendChild(document.createTextNode(tok));
            return;
          }
          let word = tok;
          let open = false;
          if (word.startsWith("**")) {
            bold = true;
            open = true;
            word = word.slice(2);
          }
          let close = false;
          if (word.includes("**")) {
            close = true;
            word = word.replace("**", "");
          }
          const s = el("w", null, "span");
          if (bold) s.style.fontWeight = "600";
          s.textContent = word;
          if (close) bold = false;
          void open;
          inner.appendChild(s);
        });
        p.appendChild(inner);
        answer.appendChild(p);
